name: 안드로이드 앱 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'admob.json', 'capacitor.config.json', 'assets/**', 'scripts/**', 'package.json', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor + AdMob 설치 (서로 맞는 버전으로)
        run: |
          CAP=$(npm view @capacitor-community/admob@latest peerDependencies --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)['@capacitor/core']))")
          echo "Capacitor 버전: $CAP"
          npm install --no-audit --no-fund "@capacitor/core@$CAP" "@capacitor/cli@$CAP" "@capacitor/android@$CAP" "@capacitor/splash-screen@$CAP" @capacitor-community/admob@latest
          npm install --no-audit --no-fund -D @capacitor/assets@latest

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1c1932' --splashBackgroundColor '#1c1932' || echo "아이콘 생성 건너뜀"

      - name: 설정 적용 (AdMob, 버전, 서명)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TARGET_SDK: ${{ vars.TARGET_SDK }}
        run: node scripts/patch-android.mjs

      - name: 웹 파일 복사
        run: npx cap sync android

      - name: 서명 키 넣기
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 시크릿이 없어요. README의 2단계를 확인하세요."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks

      - name: AAB(플레이스토어용) + APK(테스트용) 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: 결과물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: nyang-expedition-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
