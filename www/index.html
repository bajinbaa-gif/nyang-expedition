<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>냥냥 탐험대</title>
<meta name="description" content="고양이 대원들이 알아서 싸우는 방치형 RPG">
<meta name="theme-color" content="#1c1932">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="냥냥 탐험대">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="ad-config.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html,body{height:100%}body{margin:0;font-size:14px}img{max-width:100%}
html{overscroll-behavior:none}body{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{padding:0}
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 세로형 모바일 방치 RPG — 자원바 / 자동전투 씬 / 버프 줄 / 스크롤 패널 / 탭바 */
:root{
  --night:#1c1932; --panel:#28243f; --panel2:#332e52; --line:#46406b;
  --ink:#f6eddf; --muted:#b2a8c8; --lamp:#ffc857; --lamp-d:#c98f22;
  --coral:#ff8f7e; --mint:#7fd8be; --danger:#ff6b6b;
  --r-common:#c9c2dc; --r-rare:#6fb7ff; --r-epic:#c58bff; --r-legend:#ffc857;
  --f-disp:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:540px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
button{font-family:var(--f-disp);cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
img{-webkit-user-drag:none}

#top{display:flex;align-items:center;gap:8px;padding-block:10px 8px}
#fishBox{flex:1;min-width:0}
#fishAmt{font-family:var(--f-disp);font-size:28px;line-height:1;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
#fishAmt .ic{width:26px;height:26px;display:inline-flex;flex:none}
#dps{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
.res{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-family:var(--f-disp);font-size:15px;white-space:nowrap}
.res .ic,.ic18{width:18px;height:18px;display:inline-flex}
.ic svg,.ic img,.ic18 svg,.ic18 img{width:100%;height:100%;object-fit:contain}
#gear{width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
#gear svg{width:18px;height:18px}

/* scene */
#scene{position:relative;flex:none;height:clamp(240px,38vh,360px);border-radius:20px;overflow:hidden;background:#2b2552;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
#hud{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
#stageLbl{font-family:var(--f-disp);font-size:15px;background:rgba(20,16,40,.6);padding:3px 10px;border-radius:10px;white-space:nowrap}
#stageLbl small{font-family:var(--f-body);font-size:11px;color:var(--muted);margin-left:4px}
#waveDots{display:flex;gap:3px;padding-left:4px}
#waveDots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
#waveDots i.on{background:var(--lamp)}
#enemyBox{position:absolute;right:10px;top:10px;width:44%;display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:none}
#enemyName{font-family:var(--f-disp);font-size:13px;background:rgba(20,16,40,.6);padding:2px 9px;border-radius:8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
#enemyName.boss{color:#ffb3a6}
.hp{width:100%;height:10px;border-radius:999px;background:rgba(20,16,40,.7);overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b6b,#ff9a7e);border-radius:999px}
#hpTxt{font-family:var(--f-disp);font-size:11px;color:var(--ink);text-shadow:0 1px 2px #000}
#bossTimer{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:56%;height:8px;border-radius:999px;background:rgba(20,16,40,.7);overflow:hidden;pointer-events:none}
#bossTimer i{display:block;height:100%;background:var(--lamp);border-radius:999px}
#bossCtl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center}
#bossBtn{font-size:14px;padding:6px 12px;border-radius:12px;background:var(--coral);color:#2a1212;box-shadow:inset 0 -3px 0 #c45a4b;animation:pulse 1.4s ease-in-out infinite}
#autoBoss{font-family:var(--f-disp);font-size:12px;padding:5px 9px;border-radius:10px;background:rgba(20,16,40,.65);color:var(--muted)}
#autoBoss.on{color:var(--lamp)}
@keyframes pulse{50%{transform:scale(1.06)}}
.float{position:absolute;pointer-events:none;font-family:var(--f-disp);font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 4px rgba(0,0,0,.4);animation:floatUp .8s ease-out forwards;white-space:nowrap}
.float.crit{color:var(--lamp);font-size:24px}
.float.tap{color:#ffd2c9;font-size:16px}
.float.skill{color:#c9f2ff;font-size:22px}
.float.gold{color:var(--lamp);font-size:14px}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-56px) scale(1.12)}}
.skillName{position:absolute;pointer-events:none;font-family:var(--f-disp);font-size:15px;color:#2b1d07;background:var(--lamp);padding:2px 9px;border-radius:999px;animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
#gold{position:absolute;width:56px;height:40px;animation:bob 1.4s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffd86b) drop-shadow(0 0 3px #fff2b5);touch-action:manipulation;z-index:2}
#gold svg,#gold img{width:100%;height:100%;object-fit:contain}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
#toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;z-index:3}
.toast{background:rgba(20,16,40,.86);border:1px solid var(--line);padding:6px 14px;border-radius:12px;font-size:13px;text-align:center;animation:tIn .25s ease-out;max-width:100%}
.toast b{font-family:var(--f-disp);font-weight:400;color:var(--lamp)}
@keyframes tIn{from{opacity:0;transform:translateY(-6px)}}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--f-disp);font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45);pointer-events:none;animation:bannerIn 1.4s ease-out forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}

#boosts{display:flex;gap:6px;align-items:center;padding-block:8px;flex-wrap:wrap}
.chip{font-family:var(--f-disp);font-size:12px;padding:5px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:flex;gap:5px;align-items:center;white-space:nowrap}
.chip.on{background:#3d3361;border-color:var(--lamp);color:var(--lamp)}
.chip.frenzy{border-color:#ffd86b;color:#ffe9a3;background:#4b3d2a}
#adBoost{margin-left:auto}
.adtag{font-size:10px;background:var(--coral);color:#2a1414;border-radius:4px;padding:0 4px}

#panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px;scrollbar-width:thin}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.ph h2{font-family:var(--f-disp);font-weight:400;font-size:19px;margin:0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{font-size:13px;padding:4px 9px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--lamp)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px;border:1px solid transparent}
.row.locked{opacity:.5}
.ico{width:50px;height:50px;flex:none;border-radius:12px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;position:relative}
.ico svg,.ico img{width:44px;height:44px;object-fit:contain}
.ico.cat svg,.ico.cat img{width:50px;height:50px}
.info{flex:1;min-width:0}
.nm{font-family:var(--f-disp);font-size:16px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.nm .cnt{color:var(--lamp);font-size:14px}
.stars{color:var(--lamp);font-size:11px;letter-spacing:-1px}
.ds{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.buy{flex:none;min-width:92px;padding:7px 10px;border-radius:12px;background:var(--lamp);color:#2b1d07;box-shadow:inset 0 -3px 0 var(--lamp-d);font-size:14px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.buy small{font-family:var(--f-body);font-size:10px;opacity:.75}
.buy:disabled{background:var(--panel2);color:var(--muted);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);cursor:default}
.buy.alt{background:var(--coral);box-shadow:inset 0 -3px 0 #c45a4b;color:#2a1212}
.buy.mint{background:var(--mint);box-shadow:inset 0 -3px 0 #4ea88f;color:#0e2a22}
.buy:not(:disabled):active{transform:translateY(2px)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px;background:var(--panel);border-radius:14px}
.slot{border:1px dashed var(--line);background:transparent}

.gacha{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.gacha .buy{min-width:0;padding:10px}
.gacha .wide{grid-column:1/-1}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cc{background:var(--panel);border-radius:14px;padding:4px 4px 7px;display:flex;flex-direction:column;align-items:center;border:2px solid var(--line);position:relative}
.cc svg,.cc img{width:100%;max-width:74px;aspect-ratio:1;object-fit:contain}
.cc .cn{font-family:var(--f-disp);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cc .stars{position:absolute;top:3px;right:5px}
.cc.lock{opacity:.5}
.cc.inparty::after{content:"출전";position:absolute;top:4px;left:5px;font-family:var(--f-disp);font-size:10px;background:var(--mint);color:#0e2a22;border-radius:6px;padding:0 4px}
.rc{border-color:var(--r-common)}.rr{border-color:var(--r-rare)}.re{border-color:var(--r-epic)}.rl{border-color:var(--r-legend);box-shadow:0 0 12px rgba(255,200,87,.35)}
.tc{color:var(--r-common)}.tr{color:var(--r-rare)}.te{color:var(--r-epic)}.tl{color:var(--r-legend)}
.role{font-family:var(--f-disp);font-size:11px;padding:0 6px;border-radius:6px;background:var(--panel2);color:var(--muted)}

.card{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card + .card{margin-top:8px}
.qrow{display:flex;align-items:center;gap:10px}
.bar{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--lamp));border-radius:999px;transition:width .3s}
.sec{font-family:var(--f-disp);font-size:14px;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.ach{background:var(--panel);border-radius:10px;padding:7px 9px;font-size:11px;color:var(--muted);line-height:1.3;border:1px solid transparent}
.ach b{display:block;font-family:var(--f-disp);font-weight:400;font-size:13px}
.ach.done{border-color:rgba(255,200,87,.45);background:#3a3254}
.ach.done b{color:var(--lamp)}

.move{background:linear-gradient(160deg,#3a2f63,#28243f);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.move .big{font-family:var(--f-disp);font-size:34px;color:var(--lamp);line-height:1}
.zones{display:flex;gap:6px;flex-wrap:wrap}
.zn{font-family:var(--f-disp);font-size:12px;padding:3px 8px;border-radius:8px;background:var(--panel2);color:var(--muted)}
.zn.cur{background:var(--lamp);color:#2b1d07}
.zn.past{color:var(--ink)}

#tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);padding:4px 0;border-radius:10px;position:relative}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--lamp);background:var(--panel)}
#tabs .bd{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--coral)}

#modal{position:fixed;inset:0;background:rgba(10,8,24,.72);display:grid;place-items:center;padding:16px;z-index:20;animation:tIn .2s}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(420px,100%);max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.mbox h3{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:0;text-align:center;text-wrap:balance}
.mbox p{margin:0;font-size:14px;line-height:1.55;color:var(--muted);text-align:center}
.mbtns{display:flex;gap:8px}
.mbtns .buy{flex:1;min-width:0;padding:11px}
.pulls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pulls.one{grid-template-columns:minmax(0,160px);justify-content:center}
.pull{background:var(--panel2);border-radius:12px;border:2px solid var(--line);padding:4px;display:flex;flex-direction:column;align-items:center;animation:reveal .45s backwards;position:relative}
.pull svg,.pull img{width:100%;aspect-ratio:1;object-fit:contain}
.pull span{font-family:var(--f-disp);font-size:11px;white-space:nowrap}
.pull .nw{position:absolute;top:2px;left:3px;font-size:9px;font-style:normal;background:var(--coral);color:#2a1212;border-radius:4px;padding:0 3px}
@keyframes reveal{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.stat span:last-child{font-family:var(--f-disp)}
#adLayer{position:fixed;inset:0;background:#0b0918;z-index:30;display:grid;place-items:center;text-align:center;font-family:var(--f-disp);font-size:18px;gap:8px;align-content:center;padding-inline:16px}
#adLayer small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.detailArt{width:170px;height:170px;margin:0 auto}
.detailArt svg,.detailArt img{width:100%;height:100%;object-fit:contain}
@media (prefers-reduced-motion:reduce){#gold,#bossBtn{animation:none}.float{animation-duration:.01s}}
@media (max-width:380px){#fishAmt{font-size:23px}.buy{min-width:80px}.catgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

<div id="app">
  <div id="top">
    <div id="fishBox">
      <div id="fishAmt"><span class="ic" id="fishIco"></span><span id="fishTxt" class="num">0</span></div>
      <div id="dps">파티 공격력 0</div>
    </div>
    <div class="res" title="츄르"><span class="ic" id="churuIco"></span><span id="churuTxt" class="num">0</span></div>
    <div class="res" title="고양이별"><span class="ic" id="starIco"></span><span id="starTxt" class="num">0</span></div>
    <button id="gear" aria-label="설정"></button>
  </div>
  <div id="scene">
    <canvas id="cv" aria-label="전투 화면, 누르면 꾹꾹 펀치"></canvas>
    <div id="hud"><div id="stageLbl"></div><div id="waveDots"></div></div>
    <div id="enemyBox"><div id="enemyName"></div><div class="hp"><i id="hpBar"></i></div><div id="hpTxt" class="num"></div></div>
    <div id="bossTimer" hidden><i id="bossBar"></i></div>
    <div id="bossCtl"><button id="autoBoss">자동 도전</button><button id="bossBtn" hidden>보스 도전</button></div>
    <button id="gold" hidden aria-label="황금 생선"></button>
    <div id="toast"></div>
  </div>
  <div id="boosts"></div>
  <div id="panel"></div>
  <nav id="tabs"></nav>
</div>
<div id="modal" hidden></div>
<div id="adLayer" hidden></div>

<script>
"use strict";
/* =========================================================
   냥냥 탐험대 — 고양이 자동전투 방치형 RPG
   · 이미지 교체: ASSETS 배열에 키를 넣고 assets/<키>.png 를 같이 올리면 자동 적용
   · 광고: Ads.showRewarded() 한 곳만 AdMob 보상형 광고로 교체
   ========================================================= */
const SAVE_KEY='nyang_expedition_v2';
const ASSET_FILES={'bg_0':'bg_0.jpg','bg_1':'bg_1.jpg','bg_2':'bg_2.jpg','bg_3':'bg_3.jpg','bg_4':'bg_4.jpg','cat_bandit':'cat_bandit.png','cat_blue':'cat_blue.png','cat_bolt':'cat_bolt.png','cat_boots':'cat_boots.png','cat_chz':'cat_chz.png','cat_cloud':'cat_cloud.png','cat_cow':'cat_cow.png','cat_crm':'cat_crm.png','cat_fold':'cat_fold.png','cat_forest':'cat_forest.png','cat_gdo':'cat_gdo.png','cat_hyg':'cat_hyg.png','cat_kkm':'cat_kkm.png','cat_kong':'cat_kong.png','cat_kuro':'cat_kuro.png','cat_leo':'cat_leo.png','cat_leon':'cat_leon.png','cat_luna':'cat_luna.png','cat_robin':'cat_robin.png','cat_rudy':'cat_rudy.png','cat_sage':'cat_sage.png','cat_sam':'cat_sam.png','cat_shade':'cat_shade.png','cat_siam':'cat_siam.png','cat_snow':'cat_snow.png','cat_som':'cat_som.png','cat_tux':'cat_tux.png','fac_0':'fac_0.png','fac_1':'fac_1.png','fac_2':'fac_2.png','fac_3':'fac_3.png','fac_4':'fac_4.png','fac_5':'fac_5.png','fac_6':'fac_6.png','fac_7':'fac_7.png','fac_8':'fac_8.png','ico_chest':'ico_chest.png','ico_fish':'ico_fish.png','ico_gem':'ico_gem.png','ico_goldfish':'ico_goldfish.png','ico_heart':'ico_heart.png','ico_star':'ico_star.png','ico_sword':'ico_sword.png','mob_0_0':'mob_0_0.png','mob_0_1':'mob_0_1.png','mob_0_2':'mob_0_2.png','mob_0_3':'mob_0_3.png','mob_1_0':'mob_1_0.png','mob_1_1':'mob_1_1.png','mob_1_2':'mob_1_2.png','mob_1_3':'mob_1_3.png','mob_2_0':'mob_2_0.png','mob_2_1':'mob_2_1.png','mob_2_2':'mob_2_2.png','mob_2_3':'mob_2_3.png','mob_3_0':'mob_3_0.png','mob_3_1':'mob_3_1.png','mob_3_2':'mob_3_2.png','mob_3_3':'mob_3_3.png','mob_4_0':'mob_4_0.png','mob_4_1':'mob_4_1.png','mob_4_2':'mob_4_2.png','mob_4_3':'mob_4_3.png'};
const HAS=new Set(Object.keys(ASSET_FILES));
const afile=k=>'assets/'+ASSET_FILES[k];
const $=s=>document.querySelector(s);
const now=()=>Date.now();

/* ---------- 숫자 ---------- */
const UNITS=['','만','억','조','경','해','자','양','구','간','정','재','극'];
function fmt(n){
 if(!isFinite(n))return '∞';if(n<0)return '-'+fmt(-n);
 if(n<10)return (Math.floor(n*10)/10).toString();
 if(n<1e4)return Math.floor(n).toLocaleString('ko-KR');
 const e=Math.floor(Math.log10(n)/4);if(e>=UNITS.length)return n.toExponential(2).replace('+','');
 const v=n/Math.pow(10,4*e);
 return (v<10?(Math.floor(v*100)/100).toString():v<100?(Math.floor(v*10)/10).toString():Math.floor(v).toLocaleString('ko-KR'))+UNITS[e];
}
function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}시간 ${m}분`:m?`${m}분 ${String(x).padStart(2,'0')}초`:`${x}초`}

 let seed=0;for(const ch of key)seed=(seed*31+ch.charCodeAt(0))>>>0;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 const pool=DAILY_POOL.slice(),pick=[],ks=new Set();

 S.daily={date:key,list:pick,bonus:false};
}

 <p>${c.br} · <span class="role">${c.role}</span> · Lv.${o.lv} · <span style="color:var(--lamp)">${starStr(o.st)}</span>${o.st<6?` (승급까지 ${o.d}/${need})`:' · 최고 등급'}</p>
 ${o.st<6?`<div class="bar"><i style="width:${o.d/need*100}%"></i></div>`:''}
 <div class="card" style="background:var(--panel2)"><div class="ds" style="font-size:13px;color:var(--ink)">공격력 ${fmt(catDps(id)*dmgMult())}/초 · ★배율 ×${STAR_MULT[o.st-1]}</div><div class="ds">스킬 · ${SKILL[c.role][0]}${c.role==='힐러'?' (5초 동안 파티 공격 속도·스킬 1.5배)':` (공격력의 ${SKILL[c.role][1]}배${c.role==='암살자'?', 반드시 치명타':''})`}</div><div class="ds">보유 효과 · ${c.pas.map(([t,v])=>PAS_TXT[t](v*o.st)).join(' · ')}</div></div>
 <div class="mbtns"><button class="buy mint" id="mParty" ${!inP&&full&&S.party.length>0?'':''}>${inP?'출전 빼기':full?'마지막 자리와 교체':'출전시키기'}</button><button class="buy" id="mOk">닫기</button></div>`,m=>{
  m.querySelector('#mOk').onclick=closeModal;
  const mp=m.querySelector('#mParty');if(inP&&S.party.length===1){mp.disabled=true;mp.textContent='마지막 대원이에요'}
  mp.onclick=()=>{if(inP){S.party=S.party.filter(x=>x!==id)}else if(full){S.party[S.party.length-1]=id}else S.party.push(id);closeModal();refreshPanel(true);meow()}});
}

P.q={sig(){dailyEnsure();return 'q'+S.qi+S.daily.date+S.daily.list.map(m=>m.cl?1:0).join('')+S.daily.bonus+Object.keys(S.ach).length},
 build(el){dailyEnsure();const q=QUESTS[S.qi];
  let h=`<div class="ph"><h2>임무</h2><span class="ds">업적 1개마다 공격력 +1%</span></div><div class="sec"><span>탐험 일지</span><span>${Math.min(S.qi,QUESTS.length)} / ${QUESTS.length}</span></div>`;
  h+=q?`<div class="card"><div class="qrow"><div class="info"><div class="nm">${questText(q)}</div><div class="ds" id="qp"></div></div><button class="buy alt" id="qc">받기<small>츄르 ${Math.round(q[2]*churuMult())}</small></button></div><div class="bar"><i id="qb"></i></div></div>`:`<div class="empty">탐험 일지를 모두 채웠어요!</div>`;
  h+=`<div class="sec"><span>오늘의 미션</span><span>자정에 바뀌어요</span></div>`;
  S.daily.list.forEach((m,k)=>{h+=`<div class="card"><div class="qrow"><div class="info"><div class="nm">${m.n}</div><div class="ds" id="dp${k}"></div></div><button class="buy alt" id="dc${k}">${m.cl?'완료':'받기'}<small>츄르 ${Math.round(m.r*churuMult())}</small></button></div><div class="bar"><i id="db${k}"></i></div></div>`});
  h+=`<div class="card"><div class="qrow"><div class="info"><div class="nm">오늘의 미션 모두 달성</div><div class="ds">세 가지를 다 받으면 추가 보상</div></div><button class="buy mint" id="dAll">${S.daily.bonus?'완료':'받기'}<small>츄르 ${Math.round(30*churuMult())}</small></button></div></div>`;
  const done=Object.keys(S.ach).length;
  h+=`<div class="sec"><span>업적</span><span>${done} / ${ACH.length} · 공격력 +${done}%</span></div><div class="achs">`+ACH.map(a=>`<div class="ach ${S.ach[a.id]?'done':''}"><b>${a.n}</b>${a.d}</div>`).join('')+'</div>';
  el.innerHTML=h;
  const qc=el.querySelector('#qc');if(qc)qc.onclick=()=>{if(questProg(q)>=q[1]){const v=gainChuru(q[2]);S.qi++;toast(`임무 완료 · 츄르 <b>+${v}</b>`);refreshPanel(true)}};
  S.daily.list.forEach((m,k)=>el.querySelector('#dc'+k).onclick=()=>{if(!m.cl&&m.prog>=m.t){m.cl=true;const v=gainChuru(m.r);toast(`미션 완료 · 츄르 <b>+${v}</b>`);refreshPanel(true)}});
  el.querySelector('#dAll').onclick=()=>{if(!S.daily.bonus&&S.daily.list.every(m=>m.cl)){S.daily.bonus=true;const v=gainChuru(30);toast(`올클리어 · 츄르 <b>+${v}</b>`);refreshPanel(true)}}},
 update(){const q=QUESTS[S.qi];if(q&&$('#qp')){const p=Math.min(questProg(q),q[1]);$('#qp').textContent=`${fmt(p)} / ${fmt(q[1])}`;$('#qb').style.width=(p/q[1]*100)+'%';$('#qc').disabled=p<q[1]}
  S.daily.list.forEach((m,k)=>{const dp=document.getElementById('dp'+k);if(!dp)return;dp.textContent=`${m.prog} / ${m.t}`;document.getElementById('db'+k).style.width=(m.prog/m.t*100)+'%';document.getElementById('dc'+k).disabled=m.cl||m.prog<m.t});
  const da=$('#dAll');if(da)da.disabled=S.daily.bonus||!S.daily.list.every(m=>m.cl)}};

let prestArm=false;
P.m={sig(){return 'm'+JSON.stringify(S.perks)+S.starsTotal+S.starsSpent+prestArm+S.prestiges},
 build(el){const zi=zoneOf(S.maxStageEver);
  let h=`<div class="ph"><h2>마을로 귀환</h2><span class="res"><span class="ic">${icon('star')}</span><span class="num">${fmt(S.starsTotal-S.starsSpent)}</span></span></div>
  <div class="move"><div class="ds" style="color:var(--ink);font-size:13px">지금 귀환하면 받는 고양이별</div><div class="big num" id="mg">0</div>
  <div class="ds">스테이지, 고양이 레벨, 마을 시설, 생선은 처음부터예요. 고양이 ★등급·츄르·업적·별 상점은 그대로예요. 지금 별 보너스: 공격력 +${Math.round(starBonus()*100)}%, 생선 +${S.starsTotal*5}%</div>
  <div class="ds" id="mn"></div>
  <div class="zones">${ZONES.map((z,k)=>`<span class="zn ${k===zi?'cur':k<zi?'past':''}">${z.n}</span>`).join('')}</div>
  <button class="buy ${prestArm?'alt':''}" id="mGo" style="padding:12px">${prestArm?'정말 귀환할까요? 한 번 더 누르면 귀환해요':'귀환하기'}</button>${prestArm?'<button class="chip" id="mCancel" style="align-self:center">취소</button>':''}</div>
  <div class="sec"><span>별 상점 · 영구 효과</span><span>귀환해도 유지</span></div><div class="list">`;
  for(const p of PERKS){const l=lv(p.id),mx=l>=p.max,c=perkCost(p,l);
   h+=`<div class="row"><div class="ico">${icon('star')}</div><div class="info"><div class="nm">${p.n} <span class="cnt num">${l}/${p.max}</span></div><div class="ds">${p.d(l)}${mx?'':` → ${p.d(l+1)}`}</div></div><button class="buy" data-p="${p.id}" ${mx||c>S.starsTotal-S.starsSpent?'disabled':''}>${mx?'최대':`<span class="num">별 ${fmt(c)}</span><small>올리기</small>`}</button></div>`}
  el.innerHTML=h+'</div>';
  el.querySelector('#mGo').onclick=()=>{if(starsGainCalc()<1)return;if(!prestArm){prestArm=true;refreshPanel(true);setTimeout(()=>{if(prestArm){prestArm=false;refreshPanel(true)}},6000)}else{prestArm=false;doPrestige()}};
  const mc=el.querySelector('#mCancel');if(mc)mc.onclick=()=>{prestArm=false;refreshPanel(true)};
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=PERKS.find(x=>x.id===b.dataset.p),l=lv(p.id),c=perkCost(p,l);if(l<p.max&&S.starsTotal-S.starsSpent>=c){S.starsSpent+=c;S.perks[p.id]=l+1;tone(900,.1,'triangle');refreshPanel(true)}})},
 update(){const g=starsGainCalc();$('#mg').textContent='+'+fmt(g);$('#mGo').disabled=g<1;
  $('#mn').textContent=S.maxStage<50?`스테이지 50부터 귀환할 수 있어요 (이번 최고 ${S.maxStage})`:`이번 최고 스테이지 ${S.maxStage} · 더 멀리 갈수록 별이 많아져요`}};

function refreshPanel(force){const p=P[S.tab],sig=p.sig();if(force||sig!==panelSig){const st=$('#panel').scrollTop;p.build($('#panel'));panelSig=sig;$('#panel').scrollTop=st}p.update()}
function badges(){const bd=$('#tabs').querySelectorAll('.bd');dailyEnsure();const q=QUESTS[S.qi];
 const pb=S.party.some(id=>lvCost(id,1)<=S.fish)||tapCost(1)<=S.fish;
 const vb=FAC.some((f,i)=>S.maxStageEver>=f.at&&!(f.max&&facLv(i)>=f.max)&&facCost(i,facLv(i))<=S.fish);
 const cb=S.churu>=30||(S.party.length<slots()&&catCount()>S.party.length);
 const qb=(q&&questProg(q)>=q[1])||S.daily.list.some(m=>!m.cl&&m.prog>=m.t)||(!S.daily.bonus&&S.daily.list.every(m=>m.cl));
 [pb,vb,cb,qb,starsGainCalc()>=1].forEach((v,k)=>{if(bd[k])bd[k].hidden=!v})}
function checkAch(){for(const a of ACH)if(!S.ach[a.id]&&a.ok()){S.ach[a.id]=1;const v=gainChuru(5);toast(`업적 달성 · <b>${a.n}</b> (츄르 +${v})`,3000)}}

function settings(arm){
 modal(`<h3>설정</h3>
 <div class="stat"><span>효과음</span><button class="chip ${S.settings.sound?'on':''}" id="sSnd">${S.settings.sound?'켜짐':'꺼짐'}</button></div>
 <div class="stat"><span>최고 스테이지</span><span>${S.maxStageEver}</span></div>
 <div class="stat"><span>처치한 몬스터</span><span>${fmt(S.kills)}</span></div>
 <div class="stat"><span>처치한 보스</span><span>${fmt(S.bosses)}</span></div>
 <div class="stat"><span>누적 생선</span><span>${fmt(S.allTime)}</span></div>
 <div class="stat"><span>고양이 부르기</span><span>${fmt(S.stats.pulls)}</span></div>
 <div class="stat"><span>귀환 횟수</span><span>${S.prestiges}</span></div>
 <div class="stat"><span>플레이 시간</span><span>${fmtTime(S.stats.playSec)}</span></div>
 <p style="font-size:12px">진행 상황은 이 기기 브라우저에 자동 저장돼요.</p>
 <div class="mbtns"><button class="buy ${arm?'alt':''}" id="sReset" style="${arm?'':'background:var(--panel2);color:var(--muted);box-shadow:none'}">${arm?'정말 처음부터? 한 번 더':'처음부터 다시 하기'}</button><button class="buy" id="mOk">닫기</button></div>`,m=>{
  m.querySelector('#mOk').onclick=closeModal;m.querySelector('#sSnd').onclick=()=>{S.settings.sound=!S.settings.sound;settings(false)};
  m.querySelector('#sReset').onclick=()=>{if(!arm)return settings(true);S=fresh();save();closeModal();heroes={};enemy=null;bgDirty=true;spawnEnemy();renderTabs();refreshPanel(true)}});
}

/* ---------- 시작 ---------- */
function start(data){
 if(data&&data.state&&data.state.v===2)S=Object.assign(fresh(),data.state);else load();sanitize();
 $('#fishIco').innerHTML=icon('fish');$('#starIco').innerHTML=icon('star');$('#churuIco').innerHTML=icon('churu');$('#starIco').innerHTML=icon('star');$('#gear').innerHTML=IC.gear;$('#gear').onclick=()=>settings(false);
 resize();autoFill();renderTabs();dailyEnsure();spawnEnemy();refreshPanel(true);renderTop();renderBoosts();
 if(!(data&&data.state)){const away=(now()-S.lastSave)/1000;if(away>60)setTimeout(()=>offlineGain(away),300)}
 window.addEventListener('resize',resize);try{new ResizeObserver(()=>resize()).observe(cv)}catch(e){}
 setInterval(()=>{renderTop();renderBoosts();renderHud();refreshPanel(false);badges()},200);
 setInterval(checkAch,1000);setInterval(save,5000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);
 requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
}
start({});Ads.init();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!Ads.native){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>

</body>
